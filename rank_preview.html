<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GeoVs — Rank Emblem Preview</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #050810;
  background-image: radial-gradient(ellipse at 50% 0%, #0d1428 0%, #050810 70%);
  color:#aaa;
  font-family: 'Palatino Linotype', Palatino, Georgia, serif;
  padding: 60px 40px 100px;
  min-height: 100vh;
}
h1 {
  text-align:center; font-size:13px; letter-spacing:9px;
  color:#c8a96e; text-transform:uppercase; margin-bottom:8px;
}
.subtitle {
  text-align:center; font-size:10px; letter-spacing:5px;
  color:#2a3444; text-transform:uppercase; margin-bottom:70px;
}
.ranks-grid {
  display:flex; flex-wrap:wrap; justify-content:center;
  gap:44px 36px; max-width:1100px; margin:0 auto;
}
.emblem-card {
  display:flex; flex-direction:column; align-items:center; gap:10px;
  cursor:pointer;
}
.emblem-svg { overflow:visible; transition:transform 0.3s, filter 0.3s; }
.emblem-card:hover .emblem-svg { transform:scale(1.1) translateY(-5px); }
.rank-name {
  font-size:11px; letter-spacing:3px; text-transform:uppercase;
  text-align:center; margin-top:5px;
}
.rank-xp { font-size:9px; opacity:0.3; letter-spacing:1px; }
.rank-lvl-badge {
  font-size:9px; letter-spacing:2px; text-transform:uppercase;
  opacity:0.4; margin-top:-4px;
}
/* separator between the 5+5 rows */
.row-break { flex-basis:100%; height:0; }

/* ── Avatar picker bar ── */
#av-bar {
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  background:rgba(5,8,16,0.96); border-top:1px solid #1a2540;
  padding:14px 24px; display:flex; align-items:center; gap:20px; flex-wrap:wrap;
}
#av-bar label { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:#4a6080; }
.av-row { display:flex; align-items:center; gap:8px; }
.av-swatch {
  width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid transparent;
  transition:border-color .2s, transform .2s;
}
.av-swatch.active, .av-swatch:hover { border-color:#c8f135; transform:scale(1.2); }
.av-opt {
  padding:3px 9px; border-radius:4px; background:#0d1428; border:1px solid #1a2540;
  color:#6a8aaa; font-size:9px; letter-spacing:1px; cursor:pointer; transition:.2s;
}
.av-opt.active, .av-opt:hover { background:#1a2848; border-color:#c8f135; color:#c8f135; }
#av-preview {
  width:42px; height:42px; border-radius:50%; overflow:hidden; flex-shrink:0;
  border:2px solid #2a3a50;
}
</style>
</head>
<body>
<h1>GeoVs · Rank Emblems</h1>
<div class="subtitle">Season 1 — Iron through Challenger</div>
<div id="root"></div>

<script>
// ─── One palette per rank ─────────────────────────────────────────────────────
const T = {
  iron:        { label:'Iron',        c1:'#2e2622', c2:'#7a6a60', c3:'#a89080', c4:'#d8c8be', glow:'rgba(122,106,96,0.6)'   },
  bronze:      { label:'Bronze',      c1:'#6b3f1e', c2:'#cd7f32', c3:'#e8a060', c4:'#f5d8a8', glow:'rgba(205,127,50,0.65)'  },
  silver:      { label:'Silver',      c1:'#3a4e60', c2:'#7aaabb', c3:'#b8d4e8', c4:'#e0f0fc', glow:'rgba(176,210,232,0.65)' },
  gold:        { label:'Gold',        c1:'#5a3e00', c2:'#d4960c', c3:'#ffd700', c4:'#fff5b0', glow:'rgba(255,215,0,0.70)'   },
  platinum:    { label:'Platinum',    c1:'#083838', c2:'#1a9888', c3:'#40d8c4', c4:'#b0f0e8', glow:'rgba(64,216,196,0.70)'  },
  emerald:     { label:'Emerald',     c1:'#082e1a', c2:'#1a8840', c3:'#28c860', c4:'#96f0b8', glow:'rgba(40,200,96,0.70)'   },
  diamond:     { label:'Diamond',     c1:'#081840', c2:'#1a50d8', c3:'#70b8ff', c4:'#c8e8ff', glow:'rgba(112,184,255,0.75)' },
  master:      { label:'Master',      c1:'#280450', c2:'#8824b0', c3:'#c840f0', c4:'#f0b0ff', glow:'rgba(200,64,240,0.75)'  },
  grandmaster: { label:'Grandmaster', c1:'#400010', c2:'#b01028', c3:'#e82848', c4:'#ffa0b0', glow:'rgba(232,40,72,0.75)'   },
  challenger:  { label:'Challenger',  c1:'#081828', c2:'#28a8d8', c3:'#70e8ff', c4:'#c0f8ff', glow:'rgba(112,232,255,0.85)' },
};

const RANKS = [
  { lvl:1,  name:'Wanderer',          xp:0,      tid:'iron'        },
  { lvl:2,  name:'Explorer',          xp:500,    tid:'bronze'      },
  { lvl:3,  name:'Pathfinder',        xp:1500,   tid:'silver'      },
  { lvl:4,  name:'Cartographer',      xp:3500,   tid:'gold'        },
  { lvl:5,  name:'Navigator',         xp:7000,   tid:'platinum'    },
  { lvl:6,  name:'Globetrotter',      xp:12000,  tid:'emerald'     },
  { lvl:7,  name:'Atlas',             xp:20000,  tid:'diamond'     },
  { lvl:8,  name:'World Scholar',     xp:32000,  tid:'master'      },
  { lvl:9,  name:'Oracle of Nations', xp:50000,  tid:'grandmaster' },
  { lvl:10, name:'Sovereign of Earth',xp:75000,  tid:'challenger'  },
];

// Wing blades: [upperBaseY, lowerBaseY, tipX, tipMidY, tipHalfH]
// Circle: cx=75, cy=64, r=22  →  left edge x=53, right x=97
const BLADES = {
  1:  [[56,73,  14,36, 5]],
  2:  [[54,69,  11,31, 4], [63,77, 26,53, 4]],
  3:  [[53,68,   7,27, 4], [62,76, 22,50, 4]],
  4:  [[52,65,   6,23, 3], [59,70, 17,40, 3], [66,78, 30,58, 4]],
  5:  [[51,64,   4,21, 3], [58,69, 15,37, 3], [65,77, 28,56, 4]],
  6:  [[50,63,   3,19, 3], [57,68, 13,34, 3], [63,76, 25,53, 4]],
  7:  [[49,62,   3,17, 3], [55,66, 11,30, 3], [61,72, 20,46, 3], [68,80, 32,62, 4]],
  8:  [[48,61,   2,15, 3], [54,65,  9,27, 3], [60,71, 18,43, 3], [67,79, 30,60, 4]],
  9:  [[47,59,   2,13, 3], [52,63,  8,25, 3], [58,68, 16,40, 3], [64,75, 26,55, 3], [71,83, 38,66, 4]],
  10: [[46,58,   1,11, 3], [51,62,  6,22, 3], [57,67, 13,37, 3], [63,74, 23,52, 3], [70,82, 35,64, 4]],
};

function mx(x) { return (150 - x).toFixed(1); }
function f(v)  { return v.toFixed(1); }

// ─── Wing blades ──────────────────────────────────────────────────────────────
function wings(lvl, t) {
  const blist = BLADES[lvl];
  const n = blist.length;
  let svg = '';

  for (let i = n-1; i >= 0; i--) {
    const [uby, lby, tx, tmy, ts] = blist[i];
    const uty = tmy - ts, lty = tmy + ts;
    const mby = (uby + lby) / 2;
    const fill  = (i === 0) ? t.c2 : t.c1;
    const fill2 = (i === 0) ? t.c3 : t.c2;

    // Left — shadow, base, facet, shine
    svg += `<path d="M 54,${uby} L ${tx},${uty} L ${tx},${lty} L 54,${lby} Z"
              fill="black" opacity="0.28" transform="translate(1.5,2)"/>`;
    svg += `<path d="M 54,${uby} L ${tx},${uty} L ${tx},${lty} L 54,${lby} Z"
              fill="${fill}" stroke="${t.c1}" stroke-width="0.5"/>`;
    svg += `<path d="M 54,${uby} L ${tx},${uty} L ${tx},${tmy} L 54,${f(mby)} Z"
              fill="${fill2}" opacity="0.35"/>`;
    svg += `<line x1="54" y1="${uby}" x2="${tx}" y2="${uty}"
              stroke="${t.c4}" stroke-width="0.8" opacity="0.55"/>`;

    // Right (mirrored)
    svg += `<path d="M ${mx(54)},${uby} L ${mx(tx)},${uty} L ${mx(tx)},${lty} L ${mx(54)},${lby} Z"
              fill="black" opacity="0.28" transform="translate(-1.5,2)"/>`;
    svg += `<path d="M ${mx(54)},${uby} L ${mx(tx)},${uty} L ${mx(tx)},${lty} L ${mx(54)},${lby} Z"
              fill="${fill}" stroke="${t.c1}" stroke-width="0.5"/>`;
    svg += `<path d="M ${mx(54)},${uby} L ${mx(tx)},${uty} L ${mx(tx)},${tmy} L ${mx(54)},${f(mby)} Z"
              fill="${fill2}" opacity="0.35"/>`;
    svg += `<line x1="${mx(54)}" y1="${uby}" x2="${mx(tx)}" y2="${uty}"
              stroke="${t.c4}" stroke-width="0.8" opacity="0.55"/>`;

    if (lvl >= 4) {
      svg += `<line x1="54" y1="${f(mby)}" x2="${tx}" y2="${tmy}"
                stroke="${t.c3}" stroke-width="0.55" opacity="0.35"/>`;
      svg += `<line x1="${mx(54)}" y1="${f(mby)}" x2="${mx(tx)}" y2="${tmy}"
                stroke="${t.c3}" stroke-width="0.55" opacity="0.35"/>`;
    }
  }

  // Shoulder pauldrons for Gold+
  if (lvl >= 4) {
    svg += `<path d="M 54,53 L 42,49 L 39,54 L 42,59 L 54,57"
              fill="${t.c1}" stroke="${t.c2}" stroke-width="0.9" opacity="0.95"/>`;
    svg += `<path d="M ${mx(54)},53 L ${mx(42)},49 L ${mx(39)},54 L ${mx(42)},59 L ${mx(54)},57"
              fill="${t.c1}" stroke="${t.c2}" stroke-width="0.9" opacity="0.95"/>`;
    svg += `<line x1="54" y1="53" x2="42" y2="49" stroke="${t.c3}" stroke-width="0.6" opacity="0.5"/>`;
    svg += `<line x1="${mx(54)}" y1="53" x2="${mx(42)}" y2="49" stroke="${t.c3}" stroke-width="0.6" opacity="0.5"/>`;
  }

  return svg;
}

// ─── Decorative ring ──────────────────────────────────────────────────────────
function ring(lvl, t) {
  const cx=75, cy=64, r=22;
  let svg = '';

  svg += `<circle cx="${cx}" cy="${cy}" r="${r+3}" fill="none"
            stroke="${t.c2}" stroke-width="4" opacity="0.12"/>`;

  if (lvl >= 7) {
    svg += `<circle cx="${cx}" cy="${cy}" r="${r+5}" fill="none"
              stroke="${t.c1}" stroke-width="1" opacity="0.45"/>`;
  }
  if (lvl >= 9) {
    svg += `<circle cx="${cx}" cy="${cy}" r="${r+8}" fill="none"
              stroke="${t.c2}" stroke-width="0.7" opacity="0.25"/>`;
  }

  svg += `<circle cx="${cx}" cy="${cy}" r="${r+1}" fill="none"
            stroke="${t.c2}" stroke-width="2.8"/>`;

  if (lvl >= 4) {
    svg += `<circle cx="${cx}" cy="${cy}" r="${r-2}" fill="none"
              stroke="${t.c2}" stroke-width="0.8" opacity="0.4"/>`;
  }

  if (lvl >= 7) {
    const ticks = 16;
    for (let i = 0; i < ticks; i++) {
      const a = (i/ticks)*Math.PI*2 - Math.PI/2;
      const isLong = (i % 4 === 0);
      const r1 = r - 1, r2 = r + (isLong ? 4 : 2.5);
      svg += `<line x1="${f(cx+Math.cos(a)*r1)}" y1="${f(cy+Math.sin(a)*r1)}"
                    x2="${f(cx+Math.cos(a)*r2)}" y2="${f(cy+Math.sin(a)*r2)}"
                    stroke="${t.c3}" stroke-width="${isLong?1:0.7}" opacity="0.5"/>`;
    }
  }

  if (lvl >= 4) {
    [[0],[Math.PI/2],[Math.PI],[Math.PI*3/2]].forEach(([a]) => {
      const sx=cx+Math.cos(a)*(r+1), sy=cy+Math.sin(a)*(r+1);
      svg += `<polygon points="${f(sx)},${f(sy-2.5)} ${f(sx+2)},${f(sy)} ${f(sx)},${f(sy+2.5)} ${f(sx-2)},${f(sy)}"
                fill="${t.c3}" stroke="${t.c1}" stroke-width="0.4"/>`;
    });
  }

  return svg;
}

// ─── Top ornament (complexity scales with level) ──────────────────────────────
function topOrn(lvl, t) {
  const cx=75, top=42;
  let svg = '';

  if (lvl === 1) {
    // Iron — minimal angular spike
    svg += `<polygon points="${cx},${top-1} ${cx-4},${top-10} ${cx+4},${top-10}"
              fill="${t.c2}"/>`;
    svg += `<line x1="${cx}" y1="${top-1}" x2="${cx}" y2="${top-10}"
              stroke="${t.c4}" stroke-width="0.7" opacity="0.5"/>`;

  } else if (lvl === 2) {
    // Bronze — diamond gem
    svg += `<polygon points="${cx},${top-1} ${cx-6},${top-10} ${cx},${top-18} ${cx+6},${top-10}"
              fill="${t.c2}" stroke="${t.c1}" stroke-width="0.8"/>`;
    svg += `<polygon points="${cx},${top-5} ${cx-3},${top-10} ${cx},${top-16} ${cx+3},${top-10}"
              fill="${t.c4}" opacity="0.45"/>`;
    svg += `<line x1="${cx}" y1="${top-1}" x2="${cx-6}" y2="${top-10}"
              stroke="${t.c4}" stroke-width="0.7" opacity="0.55"/>`;

  } else if (lvl === 3) {
    // Silver — elongated gem
    svg += `<path d="M ${cx-5},${top-2} L ${cx-9},${top-9} L ${cx-5},${top-16} L ${cx},${top-21}
                     L ${cx+5},${top-16} L ${cx+9},${top-9} L ${cx+5},${top-2}"
              fill="${t.c2}" stroke="${t.c1}" stroke-width="0.8"/>`;
    svg += `<polygon points="${cx},${top-5} ${cx-3.5},${top-11} ${cx},${top-19} ${cx+3.5},${top-11}"
              fill="${t.c4}" opacity="0.4"/>`;

  } else if (lvl === 4) {
    // Gold — gem + side fins
    svg += `<path d="M ${cx-6},${top-3} L ${cx-11},${top-10} L ${cx-6},${top-17} L ${cx},${top-23}
                     L ${cx+6},${top-17} L ${cx+11},${top-10} L ${cx+6},${top-3}"
              fill="${t.c2}" stroke="${t.c1}" stroke-width="0.8"/>`;
    svg += `<polygon points="${cx},${top-6} ${cx-4},${top-12} ${cx},${top-21} ${cx+4},${top-12}"
              fill="${t.c4}" opacity="0.4"/>`;
    svg += `<path d="M ${cx-11},${top-10} L ${cx-20},${top-7} L ${cx-18},${top-14} L ${cx-11},${top-13}"
              fill="${t.c1}" stroke="${t.c2}" stroke-width="0.5" opacity="0.85"/>`;
    svg += `<path d="M ${cx+11},${top-10} L ${cx+20},${top-7} L ${cx+18},${top-14} L ${cx+11},${top-13}"
              fill="${t.c1}" stroke="${t.c2}" stroke-width="0.5" opacity="0.85"/>`;

  } else if (lvl === 5) {
    // Platinum — faceted gem + larger fins
    svg += `<path d="M ${cx-7},${top-3} L ${cx-13},${top-11} L ${cx-8},${top-19} L ${cx},${top-25}
                     L ${cx+8},${top-19} L ${cx+13},${top-11} L ${cx+7},${top-3}"
              fill="${t.c2}" stroke="${t.c1}" stroke-width="0.8"/>`;
    svg += `<polygon points="${cx},${top-7} ${cx-5},${top-13} ${cx},${top-23} ${cx+5},${top-13}"
              fill="${t.c4}" opacity="0.45"/>`;
    svg += `<path d="M ${cx-13},${top-11} L ${cx-24},${top-7} L ${cx-22},${top-16} L ${cx-13},${top-14}"
              fill="${t.c1}" stroke="${t.c2}" stroke-width="0.5" opacity="0.9"/>`;
    svg += `<path d="M ${cx+13},${top-11} L ${cx+24},${top-7} L ${cx+22},${top-16} L ${cx+13},${top-14}"
              fill="${t.c1}" stroke="${t.c2}" stroke-width="0.5" opacity="0.9"/>`;
    svg += `<circle cx="${cx}" cy="${top-26}" r="2.5" fill="${t.c3}" stroke="${t.c1}" stroke-width="0.6"/>`;

  } else if (lvl === 6) {
    // Emerald — faceted orb with triple fin
    svg += `<path d="M ${cx-8},${top-3} L ${cx-14},${top-12} L ${cx-9},${top-20} L ${cx},${top-27}
                     L ${cx+9},${top-20} L ${cx+14},${top-12} L ${cx+8},${top-3}"
              fill="${t.c2}" stroke="${t.c1}" stroke-width="0.8"/>`;
    svg += `<path d="M ${cx},${top-5} L ${cx-5},${top-13} L ${cx},${top-25} L ${cx+5},${top-13} Z"
              fill="${t.c4}" opacity="0.4"/>`;
    // triple fins
    svg += `<path d="M ${cx-14},${top-12} L ${cx-26},${top-7}  L ${cx-24},${top-16} L ${cx-14},${top-15}"
              fill="${t.c1}" stroke="${t.c2}" stroke-width="0.5"/>`;
    svg += `<path d="M ${cx+14},${top-12} L ${cx+26},${top-7}  L ${cx+24},${top-16} L ${cx+14},${top-15}"
              fill="${t.c1}" stroke="${t.c2}" stroke-width="0.5"/>`;
    svg += `<circle cx="${cx}" cy="${top-28}" r="3" fill="${t.c3}" stroke="${t.c1}" stroke-width="0.7"/>`;
    svg += `<circle cx="${cx}" cy="${top-28}" r="1.4" fill="${t.c4}" opacity="0.8"/>`;

  } else if (lvl === 7) {
    // Diamond — crown
    const by = top - 4;
    svg += `<rect x="${cx-11}" y="${by-7}" width="22" height="6" rx="1.2"
              fill="${t.c1}" stroke="${t.c2}" stroke-width="0.9"/>`;
    svg += `<polygon points="${cx-10},${by-7} ${cx-7.5},${by-20} ${cx-5},${by-7}" fill="${t.c2}"/>`;
    svg += `<polygon points="${cx-1.5},${by-7} ${cx},${by-28} ${cx+1.5},${by-7}" fill="${t.c3}"/>`;
    svg += `<polygon points="${cx+5},${by-7} ${cx+7.5},${by-20} ${cx+10},${by-7}" fill="${t.c2}"/>`;
    svg += `<circle cx="${cx}" cy="${by-30}" r="4" fill="${t.c3}" stroke="${t.c2}" stroke-width="0.8"/>`;
    svg += `<circle cx="${cx}" cy="${by-30}" r="1.8" fill="${t.c4}" opacity="0.75"/>`;
    svg += `<circle cx="${cx-7.5}" cy="${by-21}" r="2.5" fill="${t.c3}" stroke="${t.c2}" stroke-width="0.6"/>`;
    svg += `<circle cx="${cx+7.5}" cy="${by-21}" r="2.5" fill="${t.c3}" stroke="${t.c2}" stroke-width="0.6"/>`;
    svg += `<line x1="${cx-11}" y1="${by-7}" x2="${cx+11}" y2="${by-7}"
              stroke="${t.c4}" stroke-width="0.8" opacity="0.4"/>`;

  } else if (lvl === 8) {
    // Master — elaborate crown
    const by = top - 4;
    svg += `<rect x="${cx-12}" y="${by-8}" width="24" height="6" rx="1.2"
              fill="${t.c1}" stroke="${t.c2}" stroke-width="0.9"/>`;
    svg += `<polygon points="${cx-11},${by-8} ${cx-8.5},${by-22} ${cx-5.5},${by-8}" fill="${t.c2}"/>`;
    svg += `<polygon points="${cx-1.5},${by-8} ${cx},${by-31} ${cx+1.5},${by-8}" fill="${t.c3}"/>`;
    svg += `<polygon points="${cx+5.5},${by-8} ${cx+8.5},${by-22} ${cx+11},${by-8}" fill="${t.c2}"/>`;
    // Side micro-blades on crown
    svg += `<path d="M ${cx-12},${by-5} L ${cx-22},${by-14} L ${cx-18},${by-8} L ${cx-12},${by-8}"
              fill="${t.c2}" opacity="0.85"/>`;
    svg += `<path d="M ${cx+12},${by-5} L ${cx+22},${by-14} L ${cx+18},${by-8} L ${cx+12},${by-8}"
              fill="${t.c2}" opacity="0.85"/>`;
    svg += `<circle cx="${cx}" cy="${by-33}" r="4.5" fill="${t.c3}" stroke="${t.c2}" stroke-width="0.9"/>`;
    svg += `<circle cx="${cx}" cy="${by-33}" r="2"   fill="${t.c4}" opacity="0.8"/>`;
    svg += `<circle cx="${cx-8.5}" cy="${by-23}" r="2.8" fill="${t.c3}" stroke="${t.c2}" stroke-width="0.6"/>`;
    svg += `<circle cx="${cx+8.5}" cy="${by-23}" r="2.8" fill="${t.c3}" stroke="${t.c2}" stroke-width="0.6"/>`;
    svg += `<circle cx="${cx-22}" cy="${by-14}" r="1.8" fill="${t.c3}"/>`;
    svg += `<circle cx="${cx+22}" cy="${by-14}" r="1.8" fill="${t.c3}"/>`;

  } else if (lvl === 9) {
    // Grandmaster — war crown
    const by = top - 4;
    svg += `<rect x="${cx-13}" y="${by-8}" width="26" height="6" rx="1.2"
              fill="${t.c1}" stroke="${t.c2}" stroke-width="1"/>`;
    svg += `<polygon points="${cx-12},${by-8} ${cx-9},${by-24} ${cx-5},${by-8}" fill="${t.c2}"/>`;
    svg += `<polygon points="${cx-1.5},${by-8} ${cx},${by-34} ${cx+1.5},${by-8}" fill="${t.c3}"/>`;
    svg += `<polygon points="${cx+5},${by-8} ${cx+9},${by-24} ${cx+12},${by-8}" fill="${t.c2}"/>`;
    svg += `<path d="M ${cx-13},${by-5} L ${cx-25},${by-15} L ${cx-21},${by-9} L ${cx-13},${by-9}"
              fill="${t.c2}" stroke="${t.c1}" stroke-width="0.5"/>`;
    svg += `<path d="M ${cx+13},${by-5} L ${cx+25},${by-15} L ${cx+21},${by-9} L ${cx+13},${by-9}"
              fill="${t.c2}" stroke="${t.c1}" stroke-width="0.5"/>`;
    // Second outer micro-blade
    svg += `<path d="M ${cx-21},${by-10} L ${cx-30},${by-16} L ${cx-27},${by-13}" fill="${t.c1}" opacity="0.7"/>`;
    svg += `<path d="M ${cx+21},${by-10} L ${cx+30},${by-16} L ${cx+27},${by-13}" fill="${t.c1}" opacity="0.7"/>`;
    svg += `<circle cx="${cx}" cy="${by-36}" r="5" fill="${t.c3}" stroke="${t.c2}" stroke-width="1"/>`;
    svg += `<circle cx="${cx}" cy="${by-36}" r="2.3" fill="${t.c4}" opacity="0.85"/>`;
    svg += `<circle cx="${cx}" cy="${by-36}" r="0.9" fill="white" opacity="0.9"/>`;
    svg += `<circle cx="${cx-9}" cy="${by-25}" r="3" fill="${t.c3}" stroke="${t.c2}" stroke-width="0.7"/>`;
    svg += `<circle cx="${cx+9}" cy="${by-25}" r="3" fill="${t.c3}" stroke="${t.c2}" stroke-width="0.7"/>`;
    svg += `<circle cx="${cx-25}" cy="${by-15}" r="2" fill="${t.c3}"/>`;
    svg += `<circle cx="${cx+25}" cy="${by-15}" r="2" fill="${t.c3}"/>`;

  } else {
    // Challenger — divine crown
    const by = top - 4;
    svg += `<rect x="${cx-14}" y="${by-9}" width="28" height="7" rx="1.5"
              fill="${t.c1}" stroke="${t.c2}" stroke-width="1"/>`;
    // Grand wings on crown
    svg += `<path d="M ${cx-14},${by-5} L ${cx-28},${by-16} L ${cx-23},${by-10} L ${cx-14},${by-9}"
              fill="${t.c2}" stroke="${t.c1}" stroke-width="0.5"/>`;
    svg += `<path d="M ${cx+14},${by-5} L ${cx+28},${by-16} L ${cx+23},${by-10} L ${cx+14},${by-9}"
              fill="${t.c2}" stroke="${t.c1}" stroke-width="0.5"/>`;
    // Crown spikes
    svg += `<polygon points="${cx-12},${by-9} ${cx-9.5},${by-25} ${cx-6},${by-9}" fill="${t.c2}"/>`;
    svg += `<polygon points="${cx-1.5},${by-9} ${cx},${by-38} ${cx+1.5},${by-9}" fill="${t.c4}"/>`;
    svg += `<polygon points="${cx+6},${by-9} ${cx+9.5},${by-25} ${cx+12},${by-9}" fill="${t.c2}"/>`;
    // Outer short spikes
    svg += `<polygon points="${cx-14},${by-9} ${cx-16},${by-18} ${cx-12},${by-9}" fill="${t.c1}" opacity="0.8"/>`;
    svg += `<polygon points="${cx+14},${by-9} ${cx+16},${by-18} ${cx+12},${by-9}" fill="${t.c1}" opacity="0.8"/>`;
    // Apex gem
    svg += `<circle cx="${cx}" cy="${by-41}" r="6"   fill="${t.c2}" stroke="${t.c3}" stroke-width="1.2"/>`;
    svg += `<circle cx="${cx}" cy="${by-41}" r="3.5" fill="${t.c3}"/>`;
    svg += `<circle cx="${cx}" cy="${by-41}" r="1.5" fill="${t.c4}" opacity="0.9"/>`;
    svg += `<circle cx="${cx}" cy="${by-41}" r="0.6" fill="white"  opacity="1"/>`;
    // Mid gems
    svg += `<circle cx="${cx-9.5}" cy="${by-26}" r="3.2" fill="${t.c3}" stroke="${t.c2}" stroke-width="0.7"/>`;
    svg += `<circle cx="${cx+9.5}" cy="${by-26}" r="3.2" fill="${t.c3}" stroke="${t.c2}" stroke-width="0.7"/>`;
    // Wing tip gems
    svg += `<circle cx="${cx-28}" cy="${by-16}" r="2.2" fill="${t.c3}" stroke="${t.c2}" stroke-width="0.5"/>`;
    svg += `<circle cx="${cx+28}" cy="${by-16}" r="2.2" fill="${t.c3}" stroke="${t.c2}" stroke-width="0.5"/>`;
  }

  return svg;
}

// ─── Bottom ornament ──────────────────────────────────────────────────────────
function botOrn(lvl, t) {
  const cx=75, bot=86;
  if (lvl < 7) return '';
  let svg = '';

  if (lvl <= 8) {
    svg += `<path d="M ${cx-24},${bot+2} L ${cx-13},${bot+11} L ${cx},${bot+9} L ${cx+13},${bot+11} L ${cx+24},${bot+2}"
              fill="none" stroke="${t.c2}" stroke-width="1.5"/>`;
    svg += `<line x1="${cx}" y1="${bot+2}" x2="${cx}" y2="${bot+9}"
              stroke="${t.c2}" stroke-width="1" opacity="0.6"/>`;
    svg += `<circle cx="${cx}" cy="${bot+9}" r="2" fill="${t.c3}" opacity="0.8"/>`;
  } else {
    svg += `<path d="M ${cx-30},${bot+2} L ${cx-20},${bot+13} L ${cx-8},${bot+11} L ${cx},${bot+9}
                     L ${cx+8},${bot+11} L ${cx+20},${bot+13} L ${cx+30},${bot+2}"
              fill="none" stroke="${t.c2}" stroke-width="1.5"/>`;
    svg += `<path d="M ${cx-22},${bot+7} L ${cx},${bot+18} L ${cx+22},${bot+7}"
              fill="none" stroke="${t.c1}" stroke-width="1" opacity="0.5"/>`;
    svg += `<circle cx="${cx}" cy="${bot+9}" r="2.5" fill="${t.c3}" stroke="${t.c2}" stroke-width="0.7"/>`;
    svg += `<circle cx="${cx-20}" cy="${bot+13}" r="2" fill="${t.c3}" opacity="0.7"/>`;
    svg += `<circle cx="${cx+20}" cy="${bot+13}" r="2" fill="${t.c3}" opacity="0.7"/>`;
    if (lvl === 10) {
      svg += `<path d="M ${cx-32},${bot+2} L ${cx-24},${bot+6}" fill="none" stroke="${t.c2}" stroke-width="1" opacity="0.5"/>`;
      svg += `<path d="M ${cx+32},${bot+2} L ${cx+24},${bot+6}" fill="none" stroke="${t.c2}" stroke-width="1" opacity="0.5"/>`;
      svg += `<circle cx="${cx-30}" cy="${bot+2}" r="1.5" fill="${t.c3}" opacity="0.6"/>`;
      svg += `<circle cx="${cx+30}" cy="${bot+2}" r="1.5" fill="${t.c3}" opacity="0.6"/>`;
    }
  }
  return svg;
}

// ─── Avatar ───────────────────────────────────────────────────────────────────
function avatar() {
  return `<g transform="translate(75,64) scale(0.52)">
    <path d="M -16,16 Q -20,32 -18,42 L 18,42 Q 20,32 16,16 Z" fill="#3d4c5e"/>
    <rect x="-6" y="12" width="12" height="6" rx="2" fill="#4a5a6e"/>
    <circle cx="0" cy="-8" r="25" fill="#4a5a6e"/>
    <ellipse cx="-9" cy="-11" rx="5" ry="5.5" fill="#1a2330"/>
    <ellipse cx="9" cy="-11" rx="5" ry="5.5" fill="#1a2330"/>
    <circle cx="-6.5" cy="-14" r="2" fill="white" opacity="0.85"/>
    <circle cx="11.5" cy="-14" r="2" fill="white" opacity="0.85"/>
    <circle cx="-8" cy="-11" r="2.5" fill="#0a0f18"/>
    <circle cx="10" cy="-11" r="2.5" fill="#0a0f18"/>
    <path d="M -7,0 Q 0,8 7,0" fill="none" stroke="#1a2330" stroke-width="2" stroke-linecap="round"/>
  </g>`;
}

// ─── Current avatar config (loaded from localStorage or defaults) ─────────────
let AV = { skin:0, hair:1, hairColor:0, eyes:0, mouth:0, beard:0 };
try {
  const saved = JSON.parse(localStorage.getItem('geovs_p') || '{}');
  if (saved.avatar) AV = Object.assign({}, AV, saved.avatar);
} catch(e) {}

// ─── Assemble one card ────────────────────────────────────────────────────────
function makeCard(rank) {
  const t = T[rank.tid];
  const lv = rank.lvl;
  const clipId = `clip${lv}`;
  const defs = `<defs><clipPath id="${clipId}"><circle cx="75" cy="64" r="21.5"/></clipPath></defs>`;
  const base = [wings(lv,t), ring(lv,t), topOrn(lv,t), botOrn(lv,t)].join('');

  // Inject real avatar via AvatarEngine if available, else fallback placeholder
  let avG = avatar(); // placeholder
  if (window.AvatarEngine) {
    const bust = window.AvatarEngine.renderBustSilhouette(AV, t);
    avG = `<g transform="translate(75,68) scale(0.58)">${bust}</g>`;
  }

  const content = `${base}<circle cx="75" cy="64" r="21.5" fill="#1a2030" clip-path="url(#${clipId})"/><g clip-path="url(#${clipId})">${avG}</g>`;

  return `
    <div class="emblem-card">
      <svg class="emblem-svg" viewBox="0 0 150 155" width="160" height="165" overflow="visible"
           style="filter:drop-shadow(0 0 10px ${t.glow}) drop-shadow(0 3px 14px rgba(0,0,0,0.85))">
        ${defs}${content}
      </svg>
      <div class="rank-name" style="color:${t.c3}">${rank.name}</div>
      <div class="rank-xp">Lv.${lv} · ${rank.xp.toLocaleString()} XP</div>
    </div>`;
}

// ─── Render ───────────────────────────────────────────────────────────────────
function build() {
  const root = document.getElementById('root');
  const row1 = RANKS.slice(0, 5).map(makeCard).join('');
  const row2 = RANKS.slice(5).map(makeCard).join('');
  root.innerHTML = `<div class="ranks-grid">${row1}<div class="row-break"></div>${row2}</div>`;
  updateAvPreview();
}

// ─── Avatar picker bar ────────────────────────────────────────────────────────
function updateAvPreview() {
  if (!window.AvatarEngine) return;
  const el = document.getElementById('av-preview');
  if (!el) return;
  const bust = window.AvatarEngine.renderBustSilhouette(AV);
  el.innerHTML = `<svg viewBox="-40 -52 80 100" width="42" height="42" style="border-radius:50%;overflow:hidden">
    ${bust}
  </svg>`;
}

function setAv(key, val) {
  AV[key] = val;
  document.querySelectorAll(`[data-av="${key}"]`).forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.val) === val);
  });
  build();
}

function buildAvBar() {
  if (!window.AvatarEngine) return;
  const SKIN_COLORS  = ['#FDDBB4','#F0B07A','#D08B5B','#AE5D29','#5C3317'];
  const HAIR_COLORS  = ['#2C1810','#1A1A1A','#D4A033','#8B0000','#AAAAAA','#E879A0'];
  const HAIR_LABELS  = ['None','Short','Long','Curly','Mohawk'];
  const EYE_LABELS   = ['Normal','Tired','Happy','Cool'];
  const MOUTH_LABELS = ['Smile','Grin','Neutral','Smirk'];
  const BEARD_LABELS = ['None','Stubble','Goatee','Full'];

  function swatches(key, colors) {
    return colors.map((c,i) =>
      `<div class="av-swatch ${AV[key]===i?'active':''}" data-av="${key}" data-val="${i}"
            style="background:${c}" onclick="setAv('${key}',${i})" title="${c}"></div>`
    ).join('');
  }
  function opts(key, labels) {
    return labels.map((l,i) =>
      `<span class="av-opt ${AV[key]===i?'active':''}" data-av="${key}" data-val="${i}"
             onclick="setAv('${key}',${i})">${l}</span>`
    ).join('');
  }

  document.getElementById('av-bar').innerHTML = `
    <svg id="av-preview" viewBox="-50 -55 100 110" width="42" height="42" style="border-radius:50%;overflow:hidden;border:2px solid #2a3a50;flex-shrink:0"></svg>
    <div class="av-row"><label>Skin</label>${swatches('skin', SKIN_COLORS)}</div>
    <div class="av-row"><label>Hair</label>${opts('hair', HAIR_LABELS)}</div>
    <div class="av-row"><label>Color</label>${swatches('hairColor', HAIR_COLORS)}</div>
    <div class="av-row"><label>Eyes</label>${opts('eyes', EYE_LABELS)}</div>
    <div class="av-row"><label>Mouth</label>${opts('mouth', MOUTH_LABELS)}</div>
    <div class="av-row"><label>Beard</label>${opts('beard', BEARD_LABELS)}</div>`;
  updateAvPreview();
}
</script>

<script src="avatar.js"></script>
<script>
  // Avatar bar + emblems built after avatar.js loads
  window.addEventListener('DOMContentLoaded', () => { build(); });

  // Avatar bar placeholder while avatar.js loads
  document.getElementById('av-bar').innerHTML =
    `<span style="font-size:10px;letter-spacing:3px;color:#2a3a50">AVATAR PICKER — loading...</span>`;
</script>

<div id="av-bar"></div>
</body>
</html>
