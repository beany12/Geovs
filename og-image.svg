<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e0e1a"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Globe -->
  <circle cx="600" cy="260" r="120" fill="none" stroke="#b8ff10" stroke-width="3" opacity=".3"/>
  <ellipse cx="600" cy="260" rx="50" ry="120" fill="none" stroke="#b8ff10" stroke-width="2" opacity=".2"/>
  <line x1="480" y1="260" x2="720" y2="260" stroke="#b8ff10" stroke-width="2" opacity=".2"/>
  <!-- Title -->
  <text x="600" y="440" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="900" font-size="72" fill="#e8e8f4">Geo<tspan fill="#b8ff10">Genius</tspan></text>
  <!-- Subtitle -->
  <text x="600" y="500" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="600" font-size="28" fill="#8888a8">8 Game Modes · 195 Countries · Free</text>
  <!-- Game mode icons row -->
  <text x="600" y="560" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="500" font-size="20" fill="#5a5a78">Higher or Lower · Map Sniper · Capitals · Flags · Party Games</text>
</svg>
